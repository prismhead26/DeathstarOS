[package]
name = "deathstar-os"
version = "0.1.0"
description = "A macOS system control application"
authors = ["Aiden Wahed"]
edition = "2021"

[lib]
name = "deathstar_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "deathstar-os"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# macOS system control
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
core-foundation = "0.10"
core-foundation-sys = "0.8"
